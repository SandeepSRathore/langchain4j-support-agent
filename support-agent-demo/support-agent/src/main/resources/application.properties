spring.application.name=support-agent
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

# ----------------------------------------------------------------------
# LLM (LangChain4j OpenAI starter). The AgentResponse return type of the
# SupportAgent AI service is requested as strict JSON-schema output.
# ----------------------------------------------------------------------
# The real key lives in support-agent/secrets.properties (untracked), which is
# imported here and overrides this placeholder. The import is optional, so the
# app still starts without that file - OpenAI calls will just fail with a 401.
spring.config.import=optional:file:./secrets.properties
langchain4j.open-ai.chat-model.api-key=SET_IN_SECRETS_PROPERTIES
langchain4j.open-ai.chat-model.model-name=gpt-4o-mini
langchain4j.open-ai.chat-model.response-format=json_schema
langchain4j.open-ai.chat-model.strict-json-schema=true
langchain4j.open-ai.chat-model.timeout=120s
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false

# ----------------------------------------------------------------------
# Outbound mail (SMTP) - used only to SEED the fake inbox with test emails.
# Points at the Mailpit container from compose.yaml.
# ----------------------------------------------------------------------
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ----------------------------------------------------------------------
# Inbox monitoring (Mailpit REST API) - what the agent watches.
# ----------------------------------------------------------------------
support-agent.inbox.base-url=http://localhost:8025
# Address the agent's mailbox uses (recipient when seeding test mail).
support-agent.inbox.address=support@example.com
# How often to poll the inbox, in milliseconds.
support-agent.inbox.poll-interval=10000
# Max unread messages pulled per poll.
support-agent.inbox.batch-size=50

# ----------------------------------------------------------------------
# MCP client - the support tools served by mcp-server (Streamable HTTP).
# ----------------------------------------------------------------------
support-agent.mcp.url=http://localhost:8090/mcp
# Log every JSON-RPC request/response exchanged with the MCP server.
support-agent.mcp.log-traffic=false
